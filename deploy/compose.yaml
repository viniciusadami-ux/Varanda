services:
  server:
    build:
      context: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/varanda.db
      UPLOADS_DIR: /data/uploads
      TRUST_PROXY: "1"
    volumes:
      - varanda-data:/data
    networks: [varanda]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [varanda]

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    env_file: .env
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM}
      - --lt-cred-mech
      - --user=${TURN_USERNAME}:${TURN_CREDENTIAL}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks: [varanda]

networks:
  varanda:

volumes:
  varanda-data:
  caddy-data:
  caddy-config:
